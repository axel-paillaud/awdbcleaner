# Loaded by the back office and console containers (PrestaShop 8 and 9).
services:
  _defaults:
    public: false

  Axelweb\AwDbCleaner\Service\TableCleaner: ~

  # Command name also given in the tag for lazy loading (Symfony 4.4 and 6.4)
  Axelweb\AwDbCleaner\Command\CleanDatabaseCommand:
    arguments:
      - '@Axelweb\AwDbCleaner\Service\TableCleaner'
    tags:
      - { name: console.command, command: 'prestashop:awdbcleaner:clean' }
