# _legacy_controller must match the tab class_name (AdminAwDbCleaner, created
# by PrestaShop from these routes at install): it carries the access rights.
awdbcleaner_configuration:
  path: /awdbcleaner/configuration
  methods: [GET]
  defaults:
    _controller: 'Axelweb\AwDbCleaner\Controller\AdminConfigurationController::index'
    _legacy_controller: AdminAwDbCleaner
    _legacy_link: AdminAwDbCleaner

awdbcleaner_clean:
  path: /awdbcleaner/clean
  methods: [POST]
  defaults:
    _controller: 'Axelweb\AwDbCleaner\Controller\AdminConfigurationController::clean'
    _legacy_controller: AdminAwDbCleaner
