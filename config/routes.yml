awdbcleaner_index:
  path: /awdbcleaner/index
  methods: [GET]
  defaults:
    _controller: 'Axelweb\AwDbCleaner\Controller\AwDbCleanerController::index'
    # Needed to work with tab system
    _legacy_controller: AwDbCleaner
    _legacy_link: AwDbCleaner

awdbcleaner_form_configuration:
  path: /awdbcleaner/configuration
  methods: [GET, POST]
  defaults:
    _controller: 'Axelweb\AwDbCleaner\Controller\AdminConfigurationController::index'
    # Needed to work with tab system
    _legacy_controller: AdminAwDbCleaner
    _legacy_link: AdminAwDbCleaner
